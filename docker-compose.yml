services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vectralq-db
    environment:
      POSTGRES_USER: vectralq
      POSTGRES_PASSWORD: vectralq
      POSTGRES_DB: vectralq
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectralq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vectralq-backend
    gpus: all
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vectralq_app:vectralq_app@db:5432/vectralq
      ENVIRONMENT: local
      DEBUG: "true"
      PYTHONPATH: /app
      EMBEDDING_MODEL_NAME: BAAI/bge-large-en-v1.5
      EMBEDDING_DEVICE: cuda
      EMBEDDING_BATCH_SIZE: "128"
      SEARCH_ENABLE_CROSS_ENCODER: "true"
      CROSS_ENCODER_MODEL: "cross-encoder/ms-marco-MiniLM-L-6-v2"
      CROSS_ENCODER_TOP_N: "8"
      DEBUG_SEARCH: "true"
      CE_TIMEOUT_MS: "500"
      SENTENCE_PREFILTER_TOP: "2"
      BM25_K: "50"
      VEC_K: "50"
      SEARCH_FUSION_MODE: rrf
      REFUSAL_MIN_TOP_SCORE: "0.0"
      MIN_RRF: "0.0"
      BM25_WEIGHTED: "true"
      PHRASE_LANE_ENABLED: "true"
      PHRASE_BOOST: "0.12"
      VEC_STRONG_MIN: "0.3"
      BM25_RANK_WINDOW: "30"
      FUSED_TOP_WINDOW: "8"
      LLM_BASE_URL: https://api.openai.com
      LLM_MODEL: gpt-4o-mini
      LLM_TIMEOUT_MS: "30000"
      LLM_MAX_TOKENS: "64"
      CONTEXT_MAX_CHUNKS: "1"
      LLM_TEMPERATURE: "0.0"
      ANSWER_JSON_REQUIRED: "true"
      QUERY_EXTRACTIVE_MODE: "1"
      SYNTHESIZE_FROM_SPANS: "true"
      # OpenAI credentials are sourced from your local environment/.env; no secrets are stored in git
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_PROJECT: ${OPENAI_PROJECT_ID}
      OPENAI_ORG: ${OPENAI_ORG_ID}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    
