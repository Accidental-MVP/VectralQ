version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vectralq-db
    environment:
      POSTGRES_USER: vectralq
      POSTGRES_PASSWORD: vectralq
      POSTGRES_DB: vectralq
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectralq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vectralq-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://vectralq_app:vectralq_app@db:5432/vectralq
      ENVIRONMENT: local
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app

volumes:
  db-data:


