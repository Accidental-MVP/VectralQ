[tool.poetry]
name = "vectralq-backend"
version = "0.1.0"
description = "VectralQ FastAPI backend"
authors = ["VectralQ Team <dev@vectralq.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.29"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
pdfminer.six = "20221105"
tiktoken = "0.7.0"
python-multipart = "0.0.9"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.6"
mypy = "^1.10.0"
pytest = "^8.2.0"
httpx = "^0.27.0"

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B","SIM","PL"]
ignore = ["E203","E266","E501","W503"]

[tool.ruff.isort]
known-first-party = ["app"]


